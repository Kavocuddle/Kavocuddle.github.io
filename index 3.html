<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#03040c">
<meta name="description" content="GOLD (Go Onboard Learn Drive): a student prototype e.MAS learning portal for the PROTON Business Case Study Challenge 2026.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GOLD Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed wave canvas over a black→navy→blue gradient; left rail nav on desktop, top scroller on phones; content column max 1120px. */
@font-face{font-family:"Norwester";src:local("Norwester"),local("Norwester Regular");font-display:swap}
:root{
  --ink:#03040c; --navy:#0a0f4a; --blue:#2e33cf; --volt:#45c4ff; --gold:#f0c04d; --gold-deep:#b9852a;
  --text:#eef1ff; --muted:#a8b0e4; --faint:#6f78b8; --panel:rgba(9,13,58,.62); --panel-2:rgba(18,24,96,.55);
  --line:rgba(130,155,255,.2); --line-strong:rgba(130,170,255,.38);
  --ok:#3ee0a0; --warn:#ffb547; --bad:#ff6b7f;
  --display:"Norwester","Bebas Neue","Oswald",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:linear-gradient(118deg,var(--ink) 0%,#060930 28%,#111874 62%,var(--blue) 100%) fixed;background-color:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
#waves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}
#root{position:relative;z-index:1}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:.95;text-wrap:balance;margin:0}
h2{font-size:clamp(34px,5vw,48px)}
h3{font-size:24px}
p{margin:0}
a{color:var(--volt)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--volt);outline-offset:2px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--volt);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--text);padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:rgba(255,255,255,.09);border-color:var(--volt)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#3a40ea,#2a8fff);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1b1203;border-color:transparent}
.btn.danger{border-color:rgba(255,107,127,.5);color:var(--bad)}
.btn.danger:hover{background:rgba(255,107,127,.12);border-color:var(--bad)}
.btn.danger.solid{background:#e0485f;color:#fff;border-color:transparent}
.ck-in{width:18px;height:18px;accent-color:#45c4ff;cursor:pointer}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(62,224,160,.4);background:rgba(62,224,160,.08)}
.chip.warn{color:var(--warn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.08)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,127,.4);background:rgba(255,107,127,.08)}
.chip.lock{color:var(--faint)}
.chip.gold{color:var(--gold);border-color:rgba(240,192,77,.45);background:rgba(240,192,77,.08)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input.in,select.in,textarea.in{background:rgba(3,5,25,.6);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;color:var(--text);width:100%}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--volt);outline:none;box-shadow:0 0 0 3px rgba(69,196,255,.18)}
.hint{font-size:12px;color:var(--faint);font-weight:500}
.err{color:var(--bad);font-size:13px;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--volt),#6d7bff);border-radius:inherit}
.bar.gold>i{background:linear-gradient(90deg,var(--gold),#ffe08a)}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:rgba(69,196,255,.16);color:var(--text)}
.optgrid{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:7px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.opt.on{border-color:var(--volt);color:var(--text);background:rgba(69,196,255,.12)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--volt)}

/* GOLD stacked wordmark */
.goldmark{display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:.12em;align-items:end;font-family:var(--display);line-height:.82;color:#fff}
.goldmark .L{font-size:1em}
.goldmark .w{font-size:.42em;padding-bottom:.06em;letter-spacing:.01em}
.goldmark .w.go{font-size:.36em;align-self:center}

/* Auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr;gap:24px;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto;align-items:center}
.auth-hero{position:relative;min-height:560px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.auth-hero .logo{position:absolute;top:0;right:0;width:118px}
.auth-hero .goldmark{font-size:clamp(84px,11vw,150px)}
.hero-car{position:relative;margin-top:-30px;margin-left:auto;width:min(560px,92%);aspect-ratio:590/327;max-width:100%}
.hero-car img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:drive 7s ease-in-out infinite;filter:drop-shadow(0 30px 30px rgba(0,0,0,.55))}
.hero-car .sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);mix-blend-mode:overlay;animation:sweep 3.6s ease-in-out infinite;-webkit-mask:var(--carmask) center/contain no-repeat;mask:var(--carmask) center/contain no-repeat}
.hero-car .road{position:absolute;left:4%;right:4%;bottom:2%;height:3px;background:linear-gradient(90deg,transparent,var(--volt),transparent);filter:blur(1px);animation:pulse 1.8s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-10px,-4px,0)}}
@keyframes sweep{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.clip{display:flex;gap:14px;align-items:center;text-decoration:none;color:var(--text);padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,5,25,.45);max-width:420px}
.clip .play{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#3a40ea,#2a8fff);flex:none}
.auth-card{padding:28px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(3,5,25,.55);border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:rgba(69,196,255,.16);color:var(--text)}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rolepick button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rolepick button.on{border-color:var(--volt);background:rgba(69,196,255,.1)}
.rolepick b{font-size:14px}
.demo-logins{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}

/* Shell */
.shell{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px;border-right:1px solid var(--line);background:rgba(3,4,20,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rail .brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.rail .brand img{width:42px}
.rail .brand .goldmark{font-size:40px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left;white-space:nowrap}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav button.on{color:var(--text);background:linear-gradient(90deg,rgba(69,196,255,.18),rgba(69,196,255,0))}
.nav button .lk{margin-left:auto;opacity:.6}
.rail .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);cursor:pointer;background:none;text-align:left}
.rail .me .nm{font-size:13px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.main{padding-block:28px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.pagehead .stack{gap:8px}
.lede{max-width:62ch;color:var(--muted)}

/* Dashboard */
.modgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.modtile{display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;color:var(--text);position:relative}
.modtile:hover{border-color:var(--line-strong)}
.modtile .num{font-family:var(--display);font-size:46px;color:rgba(255,255,255,.12);position:absolute;right:16px;top:10px;line-height:1}
.modtile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(69,196,255,.12);color:var(--volt)}
.modtile.locked .ic{background:rgba(255,255,255,.05);color:var(--faint)}
.modtile.done .ic{background:rgba(62,224,160,.12);color:var(--ok)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none}
.ring>div{width:76px;height:76px;border-radius:50%;background:#0a0e3e;display:grid;place-items:center;font-family:var(--display);font-size:30px}
.hero-dash{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;overflow:hidden;position:relative}
.hero-dash .carbg{position:absolute;right:-30px;bottom:-26px;width:340px;opacity:.9;pointer-events:none}
.quicklinks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ql{display:flex;gap:12px;align-items:center;cursor:pointer;color:var(--text);text-align:left}
.ql .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.06);flex:none}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat .v{font-family:var(--display);font-size:42px;line-height:1}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.tablewrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.t th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:12px;border-bottom:1px solid rgba(130,155,255,.1);vertical-align:middle}
table.t tr:hover td{background:rgba(255,255,255,.025)}
.feed{display:flex;flex-direction:column;gap:0}
.feed .it{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid rgba(130,155,255,.1)}
.feed .it:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--volt);margin-top:7px;flex:none}

/* Academy */
.acad{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.modlist{display:flex;flex-direction:column;gap:10px}
.modbtn{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--text);padding:14px 16px}
.modbtn.on{border-color:var(--volt);box-shadow:inset 3px 0 0 var(--volt)}
.modbtn.locked{opacity:.6}
.lessons{display:flex;flex-direction:column;gap:6px}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,5,25,.35);cursor:pointer;color:var(--text);text-align:left;width:100%}
.lesson:hover{border-color:var(--line-strong)}
.lesson.on{border-color:var(--volt);background:rgba(69,196,255,.08)}
.lesson .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none;font-size:12px}
.lesson.done .ck{background:var(--ok);border-color:var(--ok);color:#03240f}
.lessonbody{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.lessonbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.keybox{border-left:3px solid var(--gold);padding:10px 14px;background:rgba(240,192,77,.06);border-radius:0 10px 10px 0}
.videocard{display:flex;gap:16px;align-items:center;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(46,51,207,.5),rgba(3,5,25,.6));border:1px solid var(--line-strong);text-decoration:none;color:var(--text)}
.videocard .thumb{width:150px;aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#0a0f4a,#2e33cf);position:relative;overflow:hidden;flex:none;max-width:40%}
.videocard .thumb img{position:absolute;inset:8% 4%;width:92%;height:84%;object-fit:contain}
.videocard .thumb .pb{position:absolute;inset:0;display:grid;place-items:center}
.videocard .thumb .pb span{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#1a1f8a}
.q{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(3,5,25,.35)}
.q .ans{display:flex;flex-direction:column;gap:8px}
.q .ans button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.03);padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--text);display:flex;gap:10px;align-items:flex-start}
.q .ans button .k{font-weight:800;color:var(--faint);width:18px;flex:none}
.q .ans button.sel{border-color:var(--volt);background:rgba(69,196,255,.1)}
.q .ans button.right{border-color:var(--ok);background:rgba(62,224,160,.1)}
.q .ans button.wrong{border-color:var(--bad);background:rgba(255,107,127,.1)}
.q .why{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.scorecard{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.statusbox{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(3,5,25,.4)}
.lockscreen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:46px 20px}
.lockscreen .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--faint)}

/* Exclusive & power */
.tilegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tip{display:flex;flex-direction:column;gap:8px}
.tip .n{font-family:var(--display);font-size:28px;color:var(--gold)}
.quote{display:flex;flex-direction:column;gap:12px}
.quote blockquote{margin:0;font-size:15.5px}
.power-letters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pl{display:flex;flex-direction:column;gap:8px}
.pl .big{font-family:var(--display);font-size:64px;line-height:.8;background:linear-gradient(180deg,#fff,var(--volt));-webkit-background-clip:text;background-clip:text;color:transparent}
.pkgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.pkg{display:flex;flex-direction:column;gap:14px}
.pkg.feat{border-color:var(--gold);background:linear-gradient(180deg,rgba(240,192,77,.12),var(--panel))}
.pkg ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:9px}
.pkg li{display:flex;gap:9px;font-size:14px}
.pkg li svg{color:var(--ok);margin-top:2px}
.price{font-family:var(--display);font-size:44px;line-height:1}

/* Maintenance */
.calc{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.sched{display:flex;flex-direction:column}
.svc{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid rgba(130,155,255,.1);align-items:center}
.svc:last-child{border-bottom:0}
.svc .when{font-family:var(--display);font-size:22px;line-height:1}
.costbars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.costbars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.costbars i{display:block;width:100%;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--volt),#3a40ea)}
.costbars span{font-size:10px;color:var(--faint)}

/* Feedback */
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;cursor:pointer;padding:2px;color:rgba(255,255,255,.2)}
.stars button.on{color:var(--gold)}
.stars svg{width:30px;height:30px;fill:currentColor}
.post{display:flex;gap:14px}
.post .body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.reply{margin-top:6px;padding:10px 12px;border-radius:10px;background:rgba(69,196,255,.07);border:1px solid rgba(69,196,255,.2);font-size:14px}
.avatar{border-radius:50%;flex:none;display:block}

/* Profile & badge */
.prof{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.avatar-editor{display:grid;grid-template-columns:180px minmax(0,1fr);gap:18px}
.badgebox{position:relative;width:min(340px,100%);aspect-ratio:520/408;margin:0 auto}
.badgebox>img{position:absolute;inset:0;width:100%;height:100%}
.badgebox .av{position:absolute;left:50%;top:9.5%;width:44%;transform:translateX(-50%);border-radius:50%;overflow:hidden;box-shadow:0 0 0 4px rgba(120,70,0,.35),inset 0 0 20px rgba(0,0,0,.3)}
.badgebox .av svg{display:block;width:100%;height:auto}
.badgebox .rib{position:absolute;left:14%;right:14%;top:65%;text-align:center;white-space:nowrap;font-family:var(--display);color:#4a2c00;font-size:clamp(14px,3.8vw,22px);letter-spacing:.06em;text-shadow:0 1px 0 rgba(255,230,160,.6)}
.cert{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.sharebtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sharebtns a,.sharebtns button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);text-decoration:none;font-size:12.5px;font-weight:600;cursor:pointer}
.sharebtns a:hover,.sharebtns button:hover{border-color:var(--volt)}
.sharebtns .done{border-color:rgba(62,224,160,.5)}
.goldcode{border:1px dashed var(--gold);border-radius:14px;padding:16px;background:rgba(240,192,77,.07);display:flex;flex-direction:column;gap:8px}

/* Drive card */
.drives{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.drivelist{display:flex;flex-direction:column;gap:8px}
.drive{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(3,5,25,.35);cursor:pointer;text-align:left;color:var(--text);width:100%}
.drive.on{border-color:var(--volt);background:rgba(69,196,255,.08)}
.drive svg.mini{width:46px;height:46px;border-radius:8px;background:#060a30}
.cardwrap{width:100%;max-width:300px;margin:0 auto}
#driveCanvas{width:100%;height:auto;aspect-ratio:9/16;border-radius:16px;display:block;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.togg{display:flex;gap:8px;flex-wrap:wrap}

/* Chat */
.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,#3a40ea,#2a8fff);color:#fff;display:grid;place-items:center;box-shadow:0 10px 30px rgba(42,143,255,.45)}
.fab .icon{width:26px;height:26px}
.chat{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:41;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 130px));display:flex;flex-direction:column;background:#070b38;border:1px solid var(--line-strong);border-radius:18px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.chat header{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(90deg,#0b1060,#1d24a8);border-bottom:1px solid var(--line)}
.chat .msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.bot{background:rgba(255,255,255,.07);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:linear-gradient(135deg,#3a40ea,#2a8fff);border-bottom-right-radius:4px;align-self:flex-end}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat .sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chat .sugg button{font-size:12px;border:1px solid var(--line);background:none;border-radius:99px;padding:5px 10px;cursor:pointer;color:var(--muted)}

/* Modal & toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(1,2,12,.72);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}

@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

.tabbar,.rail .ptitle{display:none}
.protobar{position:relative;z-index:2;background:#f0c04d;color:#1b1203;font:600 12px/1.4 var(--body);text-align:center;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}

}

}

/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>Date.now();
const fmtDate=t=>new Date(t).toLocaleDateString("en-MY",{day:"numeric",month:"short",year:"numeric"});
const ago=t=>{const s=(now()-t)/1000;if(s<60)return"just now";if(s<3600)return Math.floor(s/60)+" min ago";if(s<86400)return Math.floor(s/3600)+" h ago";return Math.floor(s/86400)+" d ago"};
const titleCase=s=>String(s).toLowerCase().replace(/(^|[\s\/-])([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\bA\/l\b/g,"a/l").replace(/\bBinti\b/g,"binti").replace(/\bBin\b/g,"bin");
const rm=n=>"RM"+n.toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(msg){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=msg;($("#app")||document.body).appendChild(d);setTimeout(()=>d.remove(),2600)}

/* sample drive routes (relative coordinates, practical sessions) */
function makeRoute(seed,n,shape){
  const pts=[];let x=0,y=0,ang=seed;
  for(let i=0;i<n;i++){
    if(shape==="loop"){const t=i/(n-1)*Math.PI*2;x=Math.cos(t)*1+Math.cos(t*3+seed)*.18;y=Math.sin(t)*.7+Math.sin(t*2+seed)*.15}
    else{ang+=Math.sin(i*.19+seed)*.32+Math.sin(i*.06+seed*2.3)*.12;if(i%17===8)ang+=1.4*Math.sign(Math.sin(seed+i));x+=Math.cos(ang)*.05;y+=Math.sin(ang)*.05}
    pts.push([x,y]);
  }
  return pts;
}

/* maintenance */
function calcMaint(){
  const m=UI.maint,d=SVC[m.model],kpm=m.kmYear/12,hz=m.years*12;
  const list=[];
  d.km.forEach((k,i)=>{const byKm=k*1000/kpm, due=Math.min(d.mo[i],byKm);if(due<=hz+0.01)list.push({i,due,trig:byKm<d.mo[i]?"km":"time",km:Math.round(Math.min(k*1000,due*kpm)),cost:d.tot[i],items:d.items[i],label:`${k},000 km / ${d.mo[i]} mo`})});
  const total=list.reduce((s,x)=>s+x.cost,0);
  return {d,list,total,perYear:total/m.years,align:Math.floor(m.kmYear*m.years/10000)};
}

function routeStats(d){return {km:d.km,time:d.min*60+d.sec,avg:d.km/((d.min*60+d.sec)/3600)}}
function routePath(pts,w,h,pad){
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const sc=Math.min((w-2*pad)/(mxx-mnx||1),(h-2*pad)/(mxy-mny||1));
  const ox=(w-(mxx-mnx)*sc)/2,oy=(h-(mxy-mny)*sc)/2;
  return pts.map(([x,y])=>[ox+(x-mnx)*sc,oy+(mxy-y)*sc]);
}

const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=Math.round(s%60);return h?`${h}h ${m}m`:`${m}m ${ss}s`};

function parseGPX(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  const pts=[...doc.querySelectorAll("trkpt,rtept")].map(p=>({lat:+p.getAttribute("lat"),lon:+p.getAttribute("lon"),t:p.querySelector("time")?Date.parse(p.querySelector("time").textContent):null})).filter(p=>isFinite(p.lat)&&isFinite(p.lon));
  if(pts.length<2)throw new Error("No track points found");
  const R=6371,rad=v=>v*Math.PI/180;let km=0,top=0;
  for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const dl=rad(b.lat-a.lat),dn=rad(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dn/2)**2;const seg=2*R*Math.asin(Math.sqrt(h));km+=seg;if(a.t&&b.t&&b.t>a.t){const sp=seg/((b.t-a.t)/3600000);if(sp<220)top=Math.max(top,sp)}}
  const t0=pts[0].t,t1=pts[pts.length-1].t;let secs=t0&&t1?(t1-t0)/1000:km/40*3600;
  const lat0=rad(pts[0].lat);const step=Math.max(1,Math.floor(pts.length/400));
  const rel=pts.filter((_,i)=>i%step===0).map(p=>[p.lon*Math.cos(lat0),p.lat]);
  const name=(doc.querySelector("trk>name,metadata>name")||{}).textContent;
  return {id:"g"+uid(),title:(name||"Imported drive").slice(0,40),km:+km.toFixed(2),min:Math.floor(secs/60),sec:Math.round(secs%60),top:Math.round(top),pts:rel,at:t0||now()};
}

  try{const dl=await claude?.use?.("downloads");const blob=await new Promise(r=>canvas.toBlob(r,"image/png"));
    if(dl&&blob){await dl.save({filename,data:blob});toast("Saved "+filename);return}
  }catch(e){if(e&&e.code==="cancelled"||e?.name==="AbortError"){return}}
  const w=document.createElement("div");w.className="scrim";w.innerHTML=`<div class="modal"><b>Press and hold (or right-click) the image to save it</b><img src="${canvas.toDataURL("image/png")}" alt="${esc(filename)}" style="border-radius:12px"><button class="btn" type="button">Close</button></div>`;w.querySelector("button").onclick=()=>w.remove();($("#app")||document.body).appendChild(w);
}
async function badgeCanvas(u){
  const c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
  try{await document.fonts.load('80px "Bebas Neue"');await document.fonts.load('700 40px Figtree')}catch(e){}
  const g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#000");g.addColorStop(.5,"#0a0f4a");g.addColorStop(1,"#2e33cf");x.fillStyle=g;x.fillRect(0,0,1080,1350);
  const disp='"Norwester","Bebas Neue",Impact,sans-serif',body='Figtree,system-ui,sans-serif';
  const bd=await loadImg(IMG.badge);const bw=820,bh=bw*408/520,bx=130,by=150;x.drawImage(bd,bx,by,bw,bh);
  const svg=avatarSVG(u.avatar,400,"").replace("<svg ",'<svg xmlns="http://www.w3.org/2000/svg" ');
  const av=await loadImg("data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg));
  const aw=bw*.44,ax=540-aw/2,ay=by+bh*.095;x.save();x.beginPath();x.arc(540,ay+aw/2,aw/2,0,7);x.clip();x.drawImage(av,ax,ay,aw,aw);x.restore();
  x.textAlign="center";x.fillStyle="#4a2c00";x.font=`64px ${disp}`;x.fillText("GOLD GRADUATE",540,by+bh*.64+58);
  x.fillStyle="#fff";x.font=`700 46px ${body}`;x.fillText(u.name,540,by+bh+110);
  x.fillStyle="rgba(240,192,77,.95)";x.font=`600 30px ${body}`;x.fillText("CERTIFIED BY PROTON · "+u.academy.toUpperCase(),540,by+bh+160);
  x.fillStyle="rgba(255,255,255,.6)";x.font=`500 28px ${body}`;x.fillText("Awarded "+fmtDate(gradDate(u.id)),540,by+bh+205);
  const lg=await loadImg(IMG.logo);x.drawImage(lg,60,50,140,140*316/420);
  x.fillStyle="#fff";x.font=`60px ${disp}`;x.textAlign="right";x.fillText("GOLD PROGRAMME",1020,120);
  return c;
}

function drawStrands(c,t){
  const r=c.getBoundingClientRect();if(!r.width)return;const d=Math.min(2,devicePixelRatio||1);
  if(c.width!==Math.round(r.width*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d)}
  const bg=c.dataset.bg==="1",x=c.getContext("2d"),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.globalCompositeOperation="lighter";
  const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,"rgba(20,30,160,1)");g.addColorStop(.5,"rgba(46,90,255,1)");g.addColorStop(1,"rgba(90,190,255,1)");
  const yAt=(s,px)=>H*(.15+s.o*.75)+Math.sin(px/W*Math.PI*2*s.f1+t*s.sp+s.ph)*H*.12+Math.sin(px/W*Math.PI*2*s.f2-t*s.sp*1.3+s.ph)*H*.05-px/W*H*.18;
  for(const s of STRANDS){x.strokeStyle=g;x.globalAlpha=s.a;x.lineWidth=s.w*d;x.beginPath();for(let px=0;px<=W;px+=10*d){const y=yAt(s,px);px?x.lineTo(px,y):x.moveTo(px,y)}x.stroke();
    const hx=((s.hl+t*.05*s.sp)%1.2-.1)*W,hy=yAt(s,hx),hr=Math.max(14*d,Math.min(60*d,H*.09));const grad=x.createRadialGradient(hx,hy,0,hx,hy,hr);grad.addColorStop(0,`rgba(170,225,255,${bg?.5:.32})`);grad.addColorStop(1,"rgba(80,160,255,0)");x.globalAlpha=1;x.fillStyle=grad;x.fillRect(hx-hr,hy-hr,hr*2,hr*2)}
  x.globalAlpha=1;x.globalCompositeOperation="source-over";
  if(!bg){const o=x.createLinearGradient(0,0,W,0);o.addColorStop(0,"rgba(5,6,26,.88)");o.addColorStop(.55,"rgba(5,6,26,.55)");o.addColorStop(1,"rgba(5,6,26,.1)");x.fillStyle=o;x.fillRect(0,0,W,H)}
}
function strandLoop(){const cs=document.querySelectorAll(".strandcv");if(!cs.length){strandRun=false;return}strandT+=.012;cs.forEach(c=>drawStrands(c,strandT));if(rmMotion){strandRun=false;return}requestAnimationFrame(strandLoop)}
function kickStrands(){if(!strandRun){strandRun=true;requestAnimationFrame(strandLoop)}}

/* ---------- waves background ---------- */
(function(){const c=$("#waves"),x=c.getContext("2d");let w,h,t=0;const rm=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){const d=Math.min(2,devicePixelRatio||1);w=c.width=innerWidth*d;h=c.height=innerHeight*d}
  function draw(){x.clearRect(0,0,w,h);x.lineWidth=Math.max(1,w/1400);for(let i=0;i<22;i++){x.strokeStyle=`rgba(69,196,255,${.1+i*.012})`;x.beginPath();for(let px=0;px<=w;px+=14){const y=h*.58+Math.sin(px/(w*.16)+i*.18+t)*h*.12+Math.sin(px/(w*.07)-i*.3+t*1.3)*h*.03-i*h*.004;px?x.lineTo(px,y):x.moveTo(px,y)}x.stroke()}if(!rm){t+=.004;requestAnimationFrame(draw)}}
  size();addEventListener("resize",size);draw();})();

render();
</script>
